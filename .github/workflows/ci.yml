name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (JDK 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: corretto

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.ref != 'refs/heads/main' }}

      - name: Compile
        run: ./gradlew compileGroovy compileTestGroovy --no-daemon --console=plain

      - name: Test
        run: ./gradlew test --no-daemon --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk25
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 14

  bootJar:
    name: bootJar
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: 25
          distribution: corretto

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build executable JAR
        run: ./gradlew bootJar --no-daemon --console=plain

      - name: Upload bootJar
        uses: actions/upload-artifact@v4
        with:
          name: grails-jobrunr-bootJar
          path: build/libs/*.jar
          retention-days: 14
