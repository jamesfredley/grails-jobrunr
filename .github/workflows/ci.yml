name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Grails 8 floor is JDK 21 (LTS). Also smoke-test on JDK 25 (current LTS at time of writing)
        # to catch forward-compat issues early. Both versions support Project Loom virtual threads.
        java: [21, 25]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java }}
          distribution: corretto

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' && github.ref != 'refs/heads/main' }}

      - name: Compile
        run: ./gradlew compileGroovy compileTestGroovy --no-daemon --console=plain

      - name: Test
        run: ./gradlew test --no-daemon --console=plain

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-jdk${{ matrix.java }}
          path: |
            build/reports/tests/
            build/test-results/
          retention-days: 14

  bootJar:
    name: bootJar
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: corretto

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build executable JAR
        run: ./gradlew bootJar --no-daemon --console=plain

      - name: Upload bootJar
        uses: actions/upload-artifact@v4
        with:
          name: grails-jobrunr-bootJar
          path: build/libs/*.jar
          retention-days: 14
